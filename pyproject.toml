[project]
name = "secretmanager"
version = "0.1.0"
description = "Portable offline secret manager for developers"
authors = [
    {name = "Jose Daniel Molina"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyside6 (>=6.11.2,<7.0.0)",
    "PySide6-Fluent-Widgets (>=1.5.1,<2.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "sqlcipher3 (>=0.6.2,<0.7.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "winaccent (>=2.1.0,<3.0.0) ; sys_platform == 'win32'"
]

[project.scripts]
secretmanager = "secretmanager.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "secretmanager", from = "src" }
]

[dependency-groups]
build = [
    "pyinstaller (==6.22.3)"
]
