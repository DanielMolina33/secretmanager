name: Build SecretManager v1.0.1-alpha

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.1-alpha"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-latest
            architecture: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install project and build dependencies
        run: poetry install --with build --no-interaction
      - name: Build and smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\windows\build_windows.ps1
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: bash packaging/unix/build_unix.sh
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: bash packaging/unix/build_unix.sh "${{ matrix.architecture }}"
      - name: Upload Windows archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SecretManager-v1.0.1-alpha-windows
          path: dist/SecretManager-v1.0.1-alpha/SecretManager-v1.0.1-alpha-windows.zip
          if-no-files-found: error
      - name: Upload Linux archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SecretManager-v1.0.1-alpha-linux
          path: dist/SecretManager-v1.0.1-alpha/SecretManager-v1.0.1-alpha-linux.tar.gz
          if-no-files-found: error
      - name: Upload macOS archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SecretManager-v1.0.1-alpha-${{ matrix.platform }}
          path: dist/SecretManager-v1.0.1-alpha/SecretManager-v1.0.1-alpha-${{ matrix.platform }}.zip
          if-no-files-found: error
