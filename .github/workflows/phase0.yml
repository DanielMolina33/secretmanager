name: Phase 0 viability

on:
  push:
  pull_request:

jobs:
  phase0:
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: poetry.lock
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Run Phase 0 viability checks
        run: poetry run python -m unittest discover -s tests -v
      - name: Install the onedir packager
        run: poetry run python -m pip install pyinstaller
      - name: Build a portable PySide6 and Fluent smoke app
        run: >-
          poetry run python -m PyInstaller --noconfirm --clean --onedir
          --collect-all PySide6 --collect-all qfluentwidgets
          --paths src --name phase0-qt-smoke
          --distpath "${{ runner.temp }}/phase0-dist"
          --workpath "${{ runner.temp }}/phase0-build"
          --specpath "${{ runner.temp }}"
          tests/phase0/qt_smoke.py
      - name: Run the bundled app outside the build directory
        env:
          PHASE0_BUNDLE_DIR: ${{ runner.temp }}/phase0-dist/phase0-qt-smoke
        run: poetry run python tests/phase0/run_bundle_smoke.py
